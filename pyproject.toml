[project]
name = "privacy-preserving-shopping-intelligence"
version = "0.1.0"
description = "Privacy-Preserving Shopping Intelligence via Federated and On-Device Learning"
requires-python = "==3.11.14"

dependencies = [
    "flwr[simulation]==1.33.0",
    "jsonschema==4.26.0",
    "lightgbm==4.7.0",
    "polars==1.43.2",
    "psutil==7.2.2",
    "pyarrow==21.0.0",
    "ray==2.55.1",
    "scikit-learn==1.9.0",
    "torch==2.13.0",
    "xxhash==4.0.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
